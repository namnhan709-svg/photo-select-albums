name: Deploy selectphoto to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble static site for GitHub Pages
        run: |
          mkdir -p _site/css _site/js _site/photowedding/logo
          cp index.html albums.html login.html portfolio.html studio-contracts.html studio-invoices.html studio-photographers.html studio-customers.html studio-reports.html 404.html .nojekyll _site/
          cp -r css/* _site/css/
          cp -r js/* _site/js/
          cp photowedding/index.js _site/photowedding/
          cp -r photowedding/logo/* _site/photowedding/logo/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
